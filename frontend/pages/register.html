<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — HerHealth AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="brand-logo" id="register-brand-link">
          <div class="brand-icon">🌸</div>
          <div class="brand-text">HerHealth <span class="brand-badge">AI</span></div>
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Begin your private, compassionate health journey</p>
      </div>

      <div id="auth-error-banner" style="display:none; background:var(--status-urgent-bg); color:var(--status-urgent); padding:12px 16px; border-radius:var(--radius-md); font-size:0.88rem; margin-bottom:20px; border:1px solid #ffcdd2;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Maya Chen" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password (minimum 6 characters)</label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-age">Age (Optional)</label>
          <input type="number" id="reg-age" class="form-input" placeholder="e.g. 24" min="10" max="100">
        </div>

        <div class="form-group">
          <label class="privacy-checkbox-label" for="reg-consent">
            <input type="checkbox" id="reg-consent" required>
            <span>
              I consent to the collection of my self-reported cycle data solely for my personal health companion experience in accordance with the <a href="/#privacy" target="_blank">Privacy Notice</a>.
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width:100%; margin-top:8px;">
          <span id="register-btn-text">Create Account</span>
          <span class="spinner" id="register-spinner" style="display:none; width:20px; height:20px; border-width:2px;"></span>
        </button>

        <div style="display:flex; align-items:center; gap:12px; margin: 16px 0;">
          <div style="flex:1; height:1px; background:var(--border-color);"></div>
          <span style="font-size:0.78rem; color:var(--text-light); text-transform:uppercase;">or</span>
          <div style="flex:1; height:1px; background:var(--border-color);"></div>
        </div>

        <button type="button" id="google-register-btn" class="btn btn-secondary" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px;">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
          <span>Sign up with Google</span>
        </button>

        <div style="text-align:center; margin-top:14px; font-size:0.75rem; color:var(--text-light);">
          🔥 Connected to Firebase: <code>herhealth-b2950</code>
        </div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/pages/login.html" id="login-redirect-link">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script type="module" src="/js/firebase-config.js"></script>
  <script src="/js/firebase-service.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
